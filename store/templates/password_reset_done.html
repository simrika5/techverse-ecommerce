{% extends "base.html" %}

{% block content %}

<div style=" min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; font-family: 'Poppins', 'Segoe UI', sans-serif; ">
<div style="
    width: 100%;
    max-width: 520px;
    padding: 45px;
    text-align: center;
    background: #f8f8f7;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.15);
">

    <div style="
        width: 65px;
        height: 65px;
        margin: 0 auto 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        background: #18181b;
        color: white;
        font-size: 25px;
    ">
        <i class="fa-solid fa-envelope"></i>
    </div>

    <h2 style="
        margin: 0 0 12px;
        color: #18181b;
        font-size: 28px;
    ">
        Check your email
    </h2>

    <p style="
        margin: 0 auto 28px;
        max-width: 400px;
        color: #71717a;
        font-size: 14px;
        line-height: 1.7;
    ">
        If an account exists with the email address you entered,
        we have sent instructions to reset your password.
    </p>

    <a href="{% url 'login' %}" style="
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 13px 22px;
        border-radius: 12px;
        background: #18181b;
        color: white;
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
    ">
        <i class="fa-solid fa-arrow-left"></i>
        Back to login
    </a>

</div>

</div>

{% endblock %}
