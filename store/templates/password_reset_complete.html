{% extends "base.html" %}

{% block content %}
<div class="complete-page">

<div class="complete-card">

    <div class="success-icon">
        <i class="fa-solid fa-check"></i>
    </div>

    <span class="complete-label">
        PASSWORD UPDATED
    </span>

    <h1>
        Password changed!
    </h1>

    <p>
        Your password has been successfully reset.
        You can now log in to your account using your new password.
    </p>

    <a href="{% url 'login' %}" class="login-btn">

        <span>
            Go to Login
        </span>

        <i class="fa-solid fa-arrow-right"></i>

    </a>

    <a href="{% url 'home' %}" class="back-link">
        <i class="fa-solid fa-house"></i>
        Back to store
    </a>

</div>

</div> <style> .complete-page { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; font-family: 'Poppins', 'Segoe UI', sans-serif; background: linear-gradient( 135deg, #08090c, #111318, #090a0d ); } .complete-card { width: 100%; max-width: 500px; box-sizing: border-box; padding: 50px 45px; text-align: center; border-radius: 25px; background: #f8f8f7; box-shadow: 0 30px 70px rgba(0,0,0,.45); } .success-icon { width: 70px; height: 70px; margin: 0 auto 25px; display: flex; align-items: center; justify-content: center; border-radius: 20px; background: #18181b; color: white; font-size: 28px; } .complete-label { display: block; margin-bottom: 8px; color: #71717a; font-size: 10px; font-weight: 800; letter-spacing: 2px; } .complete-card h1 { margin: 0; color: #18181b; font-size: 30px; font-weight: 800; } .complete-card p { margin: 12px auto 30px; max-width: 390px; color: #71717a; font-size: 13px; line-height: 1.7; } .login-btn { width: 100%; min-height: 52px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; box-sizing: border-box; padding: 14px 20px; border-radius: 13px; background: #18181b; color: white; text-decoration: none; font-size: 13px; font-weight: 800; transition: .2s; } .login-btn:hover { background: #09090b; transform: translateY(-1px); } .login-btn i { transition: .2s; } .login-btn:hover i { transform: translateX(4px); } .back-link { display: inline-flex; align-items: center; gap: 7px; margin-top: 25px; color: #71717a; font-size: 11px; font-weight: 600; text-decoration: none; } .back-link:hover { color: #18181b; } @media(max-width: 550px) { .complete-card { padding: 35px 22px; } .complete-card h1 { font-size: 26px; } } </style>

{% endblock %}
