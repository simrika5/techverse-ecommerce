{% extends "base.html" %}

{% block content %}

<h1 class="products-title">
    {{ category_name|title }}
</h1>


<div class="products">


{% for product in products %}

<div class="product-card">


    {% if product.image %}
    <img src="{{ product.image.url }}">
    {% endif %}


    <!-- Wishlist Button -->
    <form method="post" action="{% url 'add_wishlist' product.id %}" style="display:inline-block;">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.path }}">
        <button type="submit" class="wishlist-btn"><i class="fa-solid fa-heart"></i></button>
    </form>


    <div class="card-body">

        <h2>
            {{ product.name }}
        </h2>


        <div class="price">
            Rs. {{ product.price }}
        </div>


        <form method="post" action="{% url 'add_to_cart' product.id %}" style="display:inline-block;">
            {% csrf_token %}
            <button type="submit" class="btn cart-btn">Add To Cart</button>
        </form>


    </div>


</div>


{% empty %}

<h2>No products found</h2>

{% endfor %}


</div>


<style>

.product-card {
    position: relative;
}


.wishlist-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    color: #ef4444;
    font-size: 25px;
    text-decoration: none;
    z-index: 10;
}


.wishlist-btn:hover {
    color: #dc2626;
    transform: scale(1.2);
    transition: 0.2s;
}

</style>


{% endblock %}
